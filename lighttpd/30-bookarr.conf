# Bookarr reverse proxy: /bookarr/ -> 127.0.0.1:8788
$HTTP["url"] =~ "^/bookarr(/|$)" {
    setenv.add-request-header = ( "X-Forwarded-Prefix" => "/bookarr" )
    setenv.set-request-header = (
        "Host"   => "127.0.0.1:8788",
        "Origin" => "http://127.0.0.1:8788"
    )
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8788 ) ) )
    proxy.header = ( "map-urlpath" => ( "/bookarr/" => "/" ), "upgrade" => "enable" )
}
